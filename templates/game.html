<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Play multiplayer Scrabble online in room {{ code }}.">
  <title>Scrabble Room {{ code }} - Play multiplayer word game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='shell.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
</head>
<body data-page="game" data-room="{{ code }}" data-mode="{{ mode }}" data-length="{{ length }}" data-timer="{{ timer }}">
  <div id="toast" class="toast" role="alert" hidden></div>
  <div class="sr-only" aria-live="polite" id="a11y-announcer"></div>

  <!-- Fixed full-viewport game shell -->
  <main class="ll-app">
    <section class="ll-stage">
      <div class="board-wrap">
        <div id="board-scroll" class="board-scroll">
          <div id="board" class="board" role="grid" aria-label="Game board"></div>
        </div>
        <canvas id="minimap" class="minimap" width="132" height="96" hidden aria-label="Board overview: tap to jump"></canvas>
      </div>
    </section>

    <!-- Top bar: timer + turn indicator -->
    <header class="ll-topbar">
      <div class="ll-timer-card">
        <div class="ll-timer-row">
          <span class="ll-timer-icon" aria-hidden="true"></span>
          <div id="timer" class="timer ll-timer-num" aria-label="Turn timer"></div>
          <div class="ll-timer-side">
            <span class="ll-timer-label">Seconds remaining</span>
            <button id="btn-timer-toggle" class="ll-pill" type="button" hidden>Pause timer</button>
            <button id="btn-skip-time" class="ll-pill ll-pill-danger" type="button" hidden>Skip</button>
          </div>
        </div>
        <div class="ll-turn-row">
          <button id="btn-pass" class="ll-pass" type="button" disabled title="Pass turn">Pass turn</button>
          <span class="ll-turn-nav"><button id="turn-prev" class="ll-nav-btn" type="button" aria-label="Previous turn" title="Previous turn">&#9198;</button><b id="turn-number">Turn 1</b><button id="turn-next" class="ll-nav-btn" type="button" aria-label="Next turn" title="Next turn">&#9197;</button></span>
          <div id="turn-review" class="turn-review" hidden></div>
        </div>
      </div>
      <div id="turn-banner" class="turn-banner ll-turn" role="status" aria-live="polite">Connecting&hellip;</div>
    </header>

    <button id="btn-cog" class="ll-menu-btn" type="button" title="Menu" aria-label="Menu">
      <i></i><i></i><i></i>
    </button>

    <!-- Slide-down menu / extras (share link, tracker, move history) -->
    <nav id="unified-drawer-secondary-section" class="unified-drawer-secondary-section ll-menu" hidden aria-label="Menu and history">
      <div class="ll-menu-head">
        <span>Room <code id="room-code">{{ code }}</code> &middot; <span id="mode-label"></span></span>
        <span id="conn" class="conn conn-wait" title="Connection status">conn&hellip;</span>
      </div>
      <div class="ll-menu-actions">
        <button id="btn-info" class="ll-pill" type="button">How to play</button>
        <button id="btn-zoom" class="ll-pill zoom-btn" type="button" aria-pressed="false">Zoom</button>
        <button id="btn-drawer-tracker-toggle" class="ll-pill" type="button">Stats</button>
        <button id="btn-resign" class="ll-pill ll-pill-danger" type="button" hidden>Resign</button>
      </div>
      <section id="game-settings" class="ll-settings" aria-label="Game settings">
        <h3>Game settings <span id="settings-lock" class="ll-lock" hidden>&#128274; locked</span></h3>
        <dl class="ll-settings-grid">
          <dt>Language</dt><dd id="set-language">&ndash;</dd>
          <dt>Dictionary check</dt><dd id="set-check">&ndash;</dd>
          <dt>Turn timer</dt><dd id="set-timer">&ndash;</dd>
          <dt>Game length</dt><dd id="set-length">&ndash;</dd>
        </dl>
        <p id="settings-note" class="ll-settings-note"></p>
        <div class="ll-menu-actions">
          <button id="btn-settings" class="ll-pill" type="button">Edit settings</button>
          <button id="btn-restart" class="ll-pill ll-pill-danger ll-restart" type="button">Restart game</button>
        </div>
      </section>
      <div id="tracker" class="tracker" aria-label="Unseen tiles" hidden></div>
      <div id="share" class="share" hidden>
        <p>Waiting for players. Send them this link:</p>
        <div class="row">
          <input id="share-url" type="text" readonly aria-label="Shareable link">
          <button id="share-copy" class="btn" type="button">Copy</button>
        </div>
        <button id="btn-start" class="btn btn-primary btn-wide" type="button" hidden style="margin-top: 8px">Start now</button>
      </div>
      <div class="history-wrap">
        <h3>Moves</h3>
        <ol id="history" class="history"></ol>
      </div>
    </nav>

    <!-- Players panel, bottom right -->
    <aside id="players-overlay-panel" class="ll-players">
      <div class="ll-players-head">
        <span>Players</span>
        <button id="btn-toggle-players" class="ll-collapse" type="button" aria-expanded="true" aria-label="Toggle player list">&minus;</button>
      </div>
      <div class="ll-players-body">
        <div id="players" class="players"></div>
        <div class="ll-players-foot">
          <button id="btn-challenge" class="ll-pill ll-pill-danger" type="button" hidden>Challenge</button>
        </div>
      </div>
    </aside>

    <!-- Bottom bar: mascot + speech bubble, tile rack with actions -->
    <footer class="ll-bottom ll-bottom-bar" role="region" aria-label="Game controls and tile rack">
      <div class="ll-mascot-wrap">
        <div class="ll-bag-wrap">
          <div id="bag-pop" class="bag-pop" hidden>
            <div class="bag-tabs" role="tablist">
              <button class="bag-tab is-active" data-tab="bag" type="button" role="tab">Tile bag</button>
              <button class="bag-tab" data-tab="defs" type="button" role="tab">Definitions</button>
            </div>
            <div id="bag-tab-bag" class="bag-body"></div>
            <div id="bag-tab-defs" class="bag-body" hidden></div>
          </div>
          <div id="bag-btn" class="ll-mascot" role="button" tabindex="0" aria-label="Tile bag"><i></i><i></i><span id="bag-badge" class="bag-badge">&ndash;</span></div>
        </div>
        <div id="bottom-sheet-status-text" class="ll-bubble bottom-sheet-status">Your rack appears when the game starts</div>
      </div>
      <div class="ll-rack-area">
        <div id="preview" class="preview ll-preview" aria-live="polite"></div>
        <div class="ll-actions mobile-action-controls">
          <button id="btn-swap" class="ll-act ll-act-orange" type="button" disabled title="Swap tiles">Swap</button>
          <button id="btn-submit" class="ll-act ll-act-play" type="button" disabled title="Play word">Play</button>
          <button id="btn-shuffle" class="ll-act ll-act-orange" type="button" title="Shuffle rack">Shuffle</button>
          <button id="btn-recall" class="ll-act ll-act-mini" type="button" disabled title="Recall tiles">&#8634;</button>
        </div>
        <div id="rack" class="rack" aria-label="Your tile rack" tabindex="0"></div>
      </div>
    </footer>

  </main>

  <div id="modal-root"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/util.js') }}"></script>
  <script src="{{ url_for('static', filename='js/zoom.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bag.js') }}"></script>
  <script src="{{ url_for('static', filename='js/victory.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

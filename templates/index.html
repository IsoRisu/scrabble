<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrabble - play with a friend</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="index">
  <main class="landing responsive-container">
    <h1 class="logo" aria-label="Scrabble">
      <span>S</span><span>C</span><span>R</span><span>A</span><span>B</span><span>B</span><span>L</span><span>E</span>
    </h1>
    <p class="tagline">2 to 16 players, any browser, one board.</p>

    {% if error %}
      <div class="banner banner-error" role="alert">{{ error }}</div>
    {% endif %}

    <div id="rejoin" class="banner banner-info" hidden>
      <span>You have a game in progress (room <b id="rejoin-code"></b>).</span>
      <a id="rejoin-link" class="btn btn-primary" href="#">Rejoin</a>
      <button id="rejoin-forget" class="btn btn-link" type="button">Forget it</button>
    </div>

    <section class="card">
      <h2>New game</h2>
      <form id="create-form">
        <div class="field">
          <label for="create-mode"><span>Scoring mode</span>
            <select id="create-mode">
              <option value="wild" selected>Wild (automatic check, grows board)</option>
              <option value="classic">Classic (traditional Scrabble rules)</option>
            </select>
          </label>
        </div>
        <div class="field">
          <label for="create-length"><span>Game length</span>
            <select id="create-length">
              <option value="short">Short (50 tiles)</option>
              <option value="medium" selected>Medium (100 tiles)</option>
              <option value="full">Full (150 tiles)</option>
            </select>
          </label>
        </div>
        <div class="field">
          <label for="create-timer"><span>Turn timer</span>
            <select id="create-timer">
              <option value="off" selected>No timer</option>
              <option value="30s">30 seconds</option>
              <option value="60s">60 seconds</option>
              <option value="90s">90 seconds</option>
              <option value="2m">2 minutes</option>
              <option value="3m">3 minutes</option>
              <option value="5m">5 minutes</option>
            </select>
          </label>
        </div>
        <button id="create-btn" class="btn btn-primary btn-wide" type="submit">Create game</button>
      </form>
      <p id="create-error" class="form-error" role="alert" hidden></p>
      <p class="hint">You'll get a link to send to friends. Game mode, length and timer can also be changed in the room before the first turn.</p>
    </section>

    <section class="card">
      <h2>Join a game</h2>
      <form id="join-form" class="row">
        <input id="join-code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
               spellcheck="false" maxlength="8" placeholder="8-character room code" aria-label="Room code">
        <button class="btn btn-primary" type="submit">Join</button>
      </form>
      <p id="join-error" class="form-error" role="alert" hidden></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
